<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280"><title>正規化拆分資料表與反正規化適度冗餘的比較</title>
<defs><marker id="m05u05-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-arrow" d="M0,0 L8,4 L0,8 z"/></marker></defs>
<rect class="d-zone" x="10" y="12" width="164" height="248" rx="8"/>
<text class="d-title" x="92" y="34" text-anchor="middle">正規化（拆開存）</text>
<rect class="d-box d-accent" x="22" y="48" width="140" height="46" rx="6"/>
<text class="d-small" x="92" y="68" text-anchor="middle">訂單表</text>
<text class="d-small" x="92" y="84" text-anchor="middle">只有商品編號</text>
<path class="d-line" d="M92 96 V122" marker-end="url(#m05u05-arrow)"/>
<rect class="d-box" x="22" y="126" width="140" height="46" rx="6"/>
<text class="d-small" x="92" y="146" text-anchor="middle">商品表</text>
<text class="d-small" x="92" y="162" text-anchor="middle">商品名稱與現價</text>
<text class="d-small" x="92" y="198" text-anchor="middle">優：資料不重複</text>
<text class="d-small" x="92" y="216" text-anchor="middle">優：改商品名稱只改一處</text>
<text class="d-small" x="92" y="238" text-anchor="middle">缺：查詢要 JOIN 兩張表</text>

<rect class="d-zone" x="186" y="12" width="164" height="248" rx="8"/>
<text class="d-title" x="268" y="34" text-anchor="middle">反正規化（適度重複）</text>
<rect class="d-box d-accent" x="198" y="48" width="140" height="82" rx="6"/>
<text class="d-small" x="268" y="68" text-anchor="middle">訂單明細表</text>
<text class="d-small" x="268" y="86" text-anchor="middle">商品編號</text>
<text class="d-small" x="268" y="102" text-anchor="middle">＋當時品名快照</text>
<text class="d-small" x="268" y="118" text-anchor="middle">＋當時成交單價</text>
<text class="d-small" x="268" y="158" text-anchor="middle">優：查訂單不用 JOIN</text>
<text class="d-small" x="268" y="176" text-anchor="middle">優：保留歷史快照</text>
<text class="d-small" x="268" y="216" text-anchor="middle">缺：佔空間，且同步</text>
<text class="d-small" x="268" y="234" text-anchor="middle">欄位修改時要小心</text>
</svg>
