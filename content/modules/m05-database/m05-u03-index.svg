<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 270"><title>沒有索引的全表掃描與有索引的目錄跳轉比較</title>
<defs><marker id="m05u03-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-arrow" d="M0,0 L8,4 L0,8 z"/></marker></defs>
<rect class="d-zone" x="10" y="12" width="340" height="104" rx="8"/>
<text class="d-title" x="22" y="32">沒有索引：全表掃描（Full Table Scan）</text>
<rect class="d-box" x="22" y="46" width="316" height="40" rx="6"/>
<text class="d-small" x="180" y="64" text-anchor="middle">第 1 列 → 第 2 列 → 第 3 列 → … → 第 800,000 列</text>
<text class="d-small" x="180" y="80" text-anchor="middle">從頭翻到尾逐筆比對，資料越多越慢</text>
<text class="d-small" x="180" y="106" text-anchor="middle">像在沒有目錄的 80 萬頁電話簿一頁頁找人</text>

<rect class="d-zone" x="10" y="128" width="340" height="128" rx="8"/>
<text class="d-title" x="22" y="148">建立索引：先查目錄，直接跳到目標列</text>
<rect class="d-box d-accent" x="22" y="164" width="126" height="52" rx="6"/>
<text class="d-small" x="85" y="186" text-anchor="middle">索引目錄（已排序）</text>
<text class="d-small" x="85" y="203" text-anchor="middle">手機號碼 → 位置</text>
<path class="d-line" d="M150 190 H194" marker-end="url(#m05u03-arrow)"/>
<text class="d-small" x="172" y="182" text-anchor="middle">直達</text>
<rect class="d-box" x="198" y="164" width="140" height="52" rx="6"/>
<text class="d-small" x="268" y="186" text-anchor="middle">資料表指定位置</text>
<text class="d-small" x="268" y="203" text-anchor="middle">只讀這 1 筆就結束</text>
<text class="d-small" x="180" y="242" text-anchor="middle">查詢極快，但每次新增／修改都要順便更新目錄</text>
</svg>
