<rect class="d-zone" x="12" y="16" width="144" height="190" rx="8"/>
<text class="d-title" x="84" y="38" text-anchor="middle">會員表 (members)</text>
<rect class="d-box d-accent" x="24" y="52" width="120" height="36" rx="6"/><text class="d-small" x="84" y="74" text-anchor="middle">id (主鍵 PK): 501</text>
<rect class="d-box" x="24" y="96" width="120" height="32" rx="6"/><text class="d-small" x="84" y="116" text-anchor="middle">name: 陳小美</text>
