<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 320"><title>單體架構、微服務與 Serverless 三種後端切分方式比較</title>
<defs><marker id="m04u02-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-arrow" d="M0,0 L8,4 L0,8 z"/></marker></defs>
<rect class="d-zone" x="8" y="10" width="108" height="296" rx="8"/>
<text class="d-title" x="62" y="30" text-anchor="middle">單體架構</text>
<rect class="d-box d-accent" x="18" y="46" width="88" height="150" rx="6"/>
<text class="d-small" x="62" y="76" text-anchor="middle">會員模組</text>
<text class="d-small" x="62" y="114" text-anchor="middle">商品模組</text>
<text class="d-small" x="62" y="152" text-anchor="middle">訂單模組</text>
<text class="d-small" x="62" y="184" text-anchor="middle">一起打包部署</text>
<path class="d-line" d="M62 198 V226" marker-end="url(#m04u02-arrow)"/>
<rect class="d-box" x="22" y="230" width="80" height="40" rx="6"/><text class="d-small" x="62" y="254" text-anchor="middle">單一資料庫</text>

<rect class="d-zone" x="126" y="10" width="108" height="296" rx="8"/>
<text class="d-title" x="180" y="30" text-anchor="middle">微服務</text>
<rect class="d-box" x="136" y="46" width="88" height="44" rx="6"/><text class="d-small" x="180" y="66" text-anchor="middle">會員服務</text><text class="d-small" x="180" y="81" text-anchor="middle">獨立部署</text>
<rect class="d-box" x="136" y="102" width="88" height="44" rx="6"/><text class="d-small" x="180" y="122" text-anchor="middle">商品服務</text><text class="d-small" x="180" y="137" text-anchor="middle">獨立部署</text>
<rect class="d-box" x="136" y="158" width="88" height="44" rx="6"/><text class="d-small" x="180" y="178" text-anchor="middle">訂單服務</text><text class="d-small" x="180" y="193" text-anchor="middle">獨立部署</text>
<text class="d-small" x="180" y="228" text-anchor="middle">透過網路 API 溝通</text>
<rect class="d-box" x="136" y="242" width="88" height="36" rx="6"/><text class="d-small" x="180" y="264" text-anchor="middle">各自管資料</text>

<rect class="d-zone" x="244" y="10" width="108" height="296" rx="8"/>
<text class="d-title" x="298" y="30" text-anchor="middle">Serverless</text>
<rect class="d-box" x="254" y="56" width="88" height="42" rx="6"/><text class="d-small" x="298" y="75" text-anchor="middle">事件觸發</text><text class="d-small" x="298" y="90" text-anchor="middle">有請求才喚醒</text>
<path class="d-line" d="M298 100 V132" marker-end="url(#m04u02-arrow)"/>
<rect class="d-box d-accent" x="254" y="136" width="88" height="62" rx="6"/><text class="d-small" x="298" y="160" text-anchor="middle">單一函式</text><text class="d-small" x="298" y="177" text-anchor="middle">算完即釋放</text><text class="d-small" x="298" y="192" text-anchor="middle">按次計費</text>
<text class="d-small" x="298" y="232" text-anchor="middle">不用自己管主機</text>
<text class="d-small" x="298" y="260" text-anchor="middle">冷啟動有延遲</text>
</svg>
