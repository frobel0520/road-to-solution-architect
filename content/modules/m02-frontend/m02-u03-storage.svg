<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 340"><title>Cookie、Session、localStorage 各存在哪裡</title>
<defs><marker id="m02u03-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-arrow" d="M0,0 L8,4 L0,8 z"/></marker></defs>
<rect class="d-zone" x="8" y="8" width="160" height="276" rx="8"/>
<text class="d-title" x="88" y="32" text-anchor="middle">顧客的瀏覽器</text>
<rect class="d-box d-accent" x="20" y="48" width="136" height="72" rx="6"/><text class="d-text" x="88" y="72" text-anchor="middle">Cookie</text><text class="d-small" x="88" y="92" text-anchor="middle">Session ID：</text><text class="d-small" x="88" y="110" text-anchor="middle">k3f9…（亂數）</text>
<rect class="d-box" x="20" y="176" width="136" height="92" rx="6"/><text class="d-text" x="88" y="200" text-anchor="middle">localStorage</text><text class="d-small" x="88" y="220" text-anchor="middle">深色模式：開</text><text class="d-small" x="88" y="238" text-anchor="middle">最近看過的商品</text><text class="d-small" x="88" y="256" text-anchor="middle">只有 JavaScript 讀</text>
<rect class="d-zone" x="208" y="8" width="144" height="276" rx="8"/>
<text class="d-title" x="280" y="32" text-anchor="middle">伺服器</text>
<rect class="d-box" x="220" y="48" width="120" height="72" rx="6"/><text class="d-text" x="280" y="72" text-anchor="middle">Session</text><text class="d-small" x="280" y="92" text-anchor="middle">k3f9… →</text><text class="d-small" x="280" y="110" text-anchor="middle">會員 12345</text>
<path class="d-line" d="M158 84 H216" marker-end="url(#m02u03-arrow)"/>
<text class="d-small" x="88" y="140" text-anchor="middle">每個請求自動附上 ↗</text>
<rect class="d-box" x="220" y="176" width="120" height="92" rx="6"/><text class="d-text" x="280" y="210" text-anchor="middle">資料庫</text><text class="d-small" x="280" y="232" text-anchor="middle">購物車、訂單</text><text class="d-small" x="280" y="250" text-anchor="middle">跨裝置都在</text>
<path class="d-line" d="M280 122 V172" marker-end="url(#m02u03-arrow)"/>
<text class="d-small" x="12" y="308">localStorage 不會自動送出；</text>
<text class="d-small" x="12" y="326">瀏覽器裡的資料，顧客都看得到、改得了</text>
</svg>
