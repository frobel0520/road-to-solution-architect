<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 380"><title>封包依 IP 位址找到伺服器，再依 port 交給程式</title>
<defs><marker id="m01u01-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-arrow" d="M0,0 L8,4 L0,8 z"/></marker></defs>
<rect class="d-box d-accent" x="20" y="12" width="140" height="44" rx="6"/><text class="d-text" x="90" y="39" text-anchor="middle">手機</text>
<rect class="d-box" x="176" y="12" width="168" height="44" rx="6"/><text class="d-small" x="260" y="31" text-anchor="middle">封包上寫著</text><text class="d-text" x="260" y="48" text-anchor="middle">203.0.113.10 : 443</text>
<path class="d-line" d="M90 58 V92" marker-end="url(#m01u01-arrow)"/>
<rect class="d-zone" x="20" y="96" width="320" height="44" rx="8"/><text class="d-text" x="180" y="123" text-anchor="middle">網路：依 IP 位址轉送</text>
<path class="d-line" d="M90 142 V176" marker-end="url(#m01u01-arrow)"/>
<rect class="d-box" x="20" y="180" width="320" height="40" rx="6"/><text class="d-text" x="180" y="205" text-anchor="middle">防火牆：只允許 443 從外部進來</text>
<rect class="d-zone" x="20" y="236" width="320" height="132" rx="8"/>
<text class="d-small" x="328" y="256" text-anchor="end">伺服器 203.0.113.10</text>
<path class="d-line" d="M90 222 V282" marker-end="url(#m01u01-arrow)"/>
<rect class="d-box d-accent" x="32" y="286" width="128" height="64" rx="6"/><text class="d-text" x="96" y="314" text-anchor="middle">網站程式</text><text class="d-small" x="96" y="334" text-anchor="middle">port 443</text>
<rect class="d-box" x="200" y="286" width="128" height="64" rx="6"/><text class="d-text" x="264" y="314" text-anchor="middle">報表程式</text><text class="d-small" x="264" y="334" text-anchor="middle">其他 port，僅內部</text>
</svg>
