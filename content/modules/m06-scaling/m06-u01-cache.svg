<rect class="d-box" x="16" y="18" width="76" height="44" rx="6"/><text class="d-small" x="54" y="44" text-anchor="middle">顧客請求</text>
<path class="d-line" d="M94 40 H130" marker-end="url(#m06u01-arrow)"/>
