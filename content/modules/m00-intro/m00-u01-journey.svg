<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470"><title>一個請求從手機到資料庫再回來的旅程</title>
<defs><marker id="m00u01-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path class="d-arrow" d="M0,0 L8,4 L0,8 z"/></marker></defs>
<rect class="d-box d-accent" x="20" y="12" width="200" height="44" rx="6"/><text class="d-text" x="120" y="39" text-anchor="middle">手機瀏覽器</text>
<path class="d-line" d="M120 58 V80" marker-end="url(#m00u01-arrow)"/>
<rect class="d-box" x="20" y="84" width="200" height="44" rx="6"/><text class="d-text" x="120" y="111" text-anchor="middle">DNS：網址換成 IP</text><text class="d-small" x="236" y="111">模組 1</text>
<path class="d-line" d="M120 130 V152" marker-end="url(#m00u01-arrow)"/>
<rect class="d-box" x="20" y="156" width="200" height="44" rx="6"/><text class="d-text" x="120" y="183" text-anchor="middle">網路：TCP、HTTPS</text><text class="d-small" x="236" y="183">模組 1</text>
<path class="d-line" d="M120 202 V224" marker-end="url(#m00u01-arrow)"/>
<rect class="d-box" x="20" y="228" width="200" height="44" rx="6"/><text class="d-text" x="120" y="255" text-anchor="middle">CDN、負載平衡</text><text class="d-small" x="236" y="255">模組 1、6</text>
<path class="d-line" d="M120 274 V296" marker-end="url(#m00u01-arrow)"/>
<rect class="d-box" x="20" y="300" width="200" height="44" rx="6"/><text class="d-text" x="120" y="327" text-anchor="middle">API、後端程式</text><text class="d-small" x="236" y="327">模組 3、4</text>
<path class="d-line" d="M120 346 V368" marker-end="url(#m00u01-arrow)"/>
<rect class="d-box" x="20" y="372" width="200" height="44" rx="6"/><text class="d-text" x="120" y="399" text-anchor="middle">資料庫</text><text class="d-small" x="236" y="399">模組 5</text>
<path class="d-line" d="M120 418 V432 H320 V34 H226" marker-end="url(#m00u01-arrow)"/>
<text class="d-small" x="326" y="220">回應</text>
<text class="d-small" x="20" y="456">回應送回瀏覽器，組成畫面（模組 2）</text>
</svg>
