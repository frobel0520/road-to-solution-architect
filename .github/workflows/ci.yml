# 以 Harbor standards/deployment-templates/github-actions/deploy-worker.yml 為基礎（docs/03-system-design.md 第 8 節）。
# PR 只跑檢查；main push 或擁有者手動觸發才部署。
# 部署需要擁有者設定 secrets CLOUDFLARE_API_TOKEN、CLOUDFLARE_ACCOUNT_ID；還沒設定時部署標為「待 Owner 設定」並略過。
name: CI and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: Check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Type check, lint, unit tests, content validation, dependency audit
        run: npm run check
      - name: Build site
        run: npm run build
      - name: Size budget (unit pages)
        run: npm run perf:bundle
      - name: Build E2E fixture site
        run: npm run build:fixture
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E (mobile 390x844, desktop 1440x900)
        run: npm run e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: e2e-results
          path: |
            test-results
            playwright-report
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: site-dist
          path: dist
          retention-days: 3
          if-no-files-found: error

  deploy:
    name: Deploy Worker
    # 只在本 repo 的 main 執行；PR（含 fork）不會進來。
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: worker-publication
      cancel-in-progress: false
    steps:
      - name: Require owner and main
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_ACTOR" = "$GITHUB_REPOSITORY_OWNER"
      - name: Check Cloudflare secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::部署待 Owner 設定：缺少 CLOUDFLARE_API_TOKEN 或 CLOUDFLARE_ACCOUNT_ID，這次沒有部署。"
            echo "### 部署待 Owner 設定" >> "$GITHUB_STEP_SUMMARY"
            echo "缺少 GitHub Secrets CLOUDFLARE_API_TOKEN 或 CLOUDFLARE_ACCOUNT_ID，這次沒有部署。" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@v6
        if: steps.secrets.outputs.configured == 'true'
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: steps.secrets.outputs.configured == 'true'
        with:
          name: site-dist
          path: dist
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.configured == 'true'
        with:
          node-version: '22'
      - name: Publish Worker (static assets)
        if: steps.secrets.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -f dist/index.html
          # wrangler 的輸出導到檔案，log 只留結果。
          if npx --yes wrangler@4.152.0 deploy --config wrangler.toml > wrangler.log 2>&1; then
            echo "WORKER_PUBLICATION deployed"
            echo "### 已部署" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "WORKER_PUBLICATION failed"; tail -n 20 wrangler.log | grep -v -i 'token' || true; exit 1
          fi
